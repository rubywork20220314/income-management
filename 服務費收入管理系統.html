<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服務費收入管理系統</title>
    <style>
        :root {
            --notion-bg: #ffffff;
            --notion-text: #37352f;
            --notion-border: #e9e9e6;
            --notion-hover: #efefe0;
            --notion-primary: #2383e2;
            --notion-sidebar: #f7f7f5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: var(--notion-bg); color: var(--notion-text); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 220px; background-color: var(--notion-sidebar); border-right: 1px solid var(--notion-border); display: flex; flex-direction: column; padding: 15px 10px; }
        .sidebar-title { font-size: 14px; font-weight: 600; color: #7c7b77; margin-bottom: 15px; padding-left: 8px; letter-spacing: 0.5px; }
        .year-list { flex: 1; overflow-y: auto; list-style: none; }
        .year-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        .year-item:hover { background-color: var(--notion-hover); }
        .year-item.active { background-color: #edece9; font-weight: 600; }
        .delete-year-btn { color: #eb5757; border: none; background: none; cursor: pointer; font-size: 12px; display: none; }
        .year-item:hover .delete-year-btn { display: inline; }
        .add-year-btn { background: none; border: 1px dashed #b3b2af; border-radius: 6px; padding: 8px; color: var(--notion-text); cursor: pointer; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 5px; transition: background 0.2s; }
        .add-year-btn:hover { background-color: var(--notion-hover); }
        
        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
        .top-header { padding: 15px 24px; border-bottom: 1px solid var(--notion-border); display: flex; justify-content: space-between; align-items: center; }
        .current-title { font-size: 20px; font-weight: 700; }
        .backup-zones { display: flex; gap: 8px; }
        .btn-secondary { background: none; border: 1px solid var(--notion-border); padding: 5px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; color: #5f5e5b; }
        .btn-secondary:hover { background-color: var(--notion-hover); }

        /* Tabs */
        .tabs { display: flex; gap: 20px; padding: 0 24px; border-bottom: 1px solid var(--notion-border); background-color: #fff; }
        .tab-btn { padding: 12px 4px; background: none; border: none; border-bottom: 2px solid transparent; font-size: 14px; cursor: pointer; color: #7c7b77; font-weight: 500; }
        .tab-btn:hover { color: var(--notion-text); }
        .tab-btn.active { border-bottom-color: var(--notion-text); color: var(--notion-text); font-weight: 600; }
        
        /* Pane View */
        .pane { flex: 1; overflow-y: auto; padding: 24px; display: none; }
        .pane.active { display: block; }

        /* Input Form Grid */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; background: #fbfbfa; padding: 16px; border-radius: 8px; border: 1px solid var(--notion-border); }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; font-weight: 500; color: #7c7b77; }
        .form-group input, .form-group select { padding: 6px 10px; border: 1px solid var(--notion-border); border-radius: 4px; font-size: 14px; outline: none; background: #fff; }
        .form-group input:focus, .form-group select:focus { border-color: var(--notion-primary); }
        .form-group input[readonly] { background-color: #f4f4f2; color: #7c7b77; cursor: not-allowed; }
        .btn-submit { background-color: var(--notion-primary); color: white; border: none; padding: 8px 16px; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; align-self: flex-end; height: 34px; }
        .btn-submit:hover { background-color: #1a6ec2; }

        /* Table Style */
        .table-container { overflow-x: auto; border: 1px solid var(--notion-border); border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; min-width: 900px; }
        th { background-color: #f7f7f5; font-weight: 600; color: #7c7b77; padding: 10px 12px; border-bottom: 1px solid var(--notion-border); }
        td { padding: 10px 12px; border-bottom: 1px solid var(--notion-border); white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
        tr:hover { background-color: #fbfbfa; }
        .action-cell { text-align: center; width: 60px; }
        .btn-delete-row { background: none; border: none; color: #eb5757; cursor: pointer; font-size: 12px; }
        .btn-delete-row:hover { text-decoration: underline; }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stats-card { border: 1px solid var(--notion-border); padding: 16px; border-radius: 8px; background: #fff; }
        .stats-label { font-size: 12px; color: #7c7b77; margin-bottom: 6px; font-weight: 500; }
        .stats-value { font-size: 20px; font-weight: 700; color: var(--notion-text); }
        
        /* Filter Zone */
        .filter-zone { display: flex; gap: 12px; margin-bottom: 16px; background: #f7f7f5; padding: 12px; border-radius: 6px; border: 1px solid var(--notion-border); }
        .filter-group { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .filter-group input, .filter-group select { padding: 4px 8px; border: 1px solid var(--notion-border); border-radius: 4px; font-size: 13px; }

        .empty-state { text-align: center; padding: 40px; color: #afaea9; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Sidebar: Year Management -->
    <div class="sidebar">
        <div class="sidebar-title">年度子頁目錄</div>
        <ul class="year-list" id="yearList"></ul>
        <button class="add-year-btn" onclick="promptNewYear()">➕ 新增年度</button>
    </div>

    <!-- Main Content Area -->
    <div class="main-content" id="mainContent" style="display:none;">
        <div class="top-header">
            <div class="current-title" id="currentYearTitle">2026 年度</div>
            <div class="backup-zones">
                <button class="btn-secondary" onclick="exportCSV()">匯出明細(CSV)</button>
                <button class="btn-secondary" onclick="exportBackup()">備份資料(JSON)</button>
                <button class="btn-secondary" onclick="importBackup()">匯入備份</button>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('inputPane', this)">📥 輸入與明細列表</button>
            <button class="tab-btn" onclick="switchTab('queryPane', this)">📊 查詢與統計</button>
        </div>

        <!-- Tab 1: Input Pane -->
        <div id="inputPane" class="pane active">
            <form id="revenueForm" onsubmit="addRecord(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>客戶名稱</label>
                        <input type="text" id="clientName" required placeholder="請輸入客戶名稱">
                    </div>
                    <div class="form-group">
                        <label>服務項目</label>
                        <select id="serviceItem" required>
                            <option value="">--請選擇--</option>
                            <option value="記帳服務">記帳服務</option>
                            <option value="財務簽證">財務簽證</option>
                            <option value="稅務簽證">稅務簽證</option>
                            <option value="財稅務簽證">財稅務簽證</option>
                            <option value="工商服務">工商服務</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>服務內容</label>
                        <input type="text" id="serviceContent" placeholder="請輸入服務內容">
                    </div>
                    <div class="form-group">
                        <label>服務費</label>
                        <input type="number" id="serviceFee" min="0" value="0" oninput="autoCalculate()" required>
                    </div>
                    <div class="form-group">
                        <label>代扣稅額</label>
                        <input type="number" id="withholdingTax" min="0" value="0" oninput="autoCalculate()" required>
                    </div>
                    <div class="form-group">
                        <label>服務費淨額 (自動計算)</label>
                        <input type="text" id="netServiceFee" readonly value="0">
                    </div>
                    <div class="form-group">
                        <label>代墊費用</label>
                        <input type="number" id="advancedFee" min="0" value="0" oninput="autoCalculate()" required>
                    </div>
                    <div class="form-group">
                        <label>實收淨額 (自動計算)</label>
                        <input type="text" id="actualNet" readonly value="0">
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>備註</label>
                        <input type="text" id="remarks" placeholder="其他備註事項">
                    </div>
                    <button type="submit" class="btn-submit">新增紀錄</button>
                </div>
            </form>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>客戶名稱</th>
                            <th>服務項目</th>
                            <th>服務內容</th>
                            <th>服務費</th>
                            <th>代扣稅額</th>
                            <th>服務費淨額</th>
                            <th>代墊費用</th>
                            <th>實收淨額</th>
                            <th>備註</th>
                            <th class="action-cell">操作</th>
                        </tr>
                    </thead>
                    <tbody id="recordTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Tab 2: Query & Stats Pane -->
        <div id="queryPane" class="pane">
            <!-- Stats Dashboard -->
            <div class="stats-grid">
                <div class="stats-card">
                    <div class="stats-label">總服務費</div>
                    <div class="stats-value" id="statTotalFee">$0</div>
                </div>
                <div class="stats-card">
                    <div class="stats-label">總代扣稅額</div>
                    <div class="stats-value" id="statTotalTax">$0</div>
                </div>
                <div class="stats-card">
                    <div class="stats-label">總服務費淨額</div>
                    <div class="stats-value" id="statTotalNetFee">$0</div>
                </div>
                <div class="stats-card">
                    <div class="stats-label">總代墊費用</div>
                    <div class="stats-value" id="statTotalAdvanced">$0</div>
                </div>
                <div class="stats-card">
                    <div class="stats-label">總實收淨額</div>
                    <div class="stats-value" id="statTotalActual">$0</div>
                </div>
            </div>

            <!-- Query Filters -->
            <div class="filter-zone">
                <div class="filter-group">
                    <label>搜尋客戶：</label>
                    <input type="text" id="searchClient" placeholder="輸入關鍵字..." oninput="renderQueryResults()">
                </div>
                <div class="filter-group">
                    <label>服務項目篩選：</label>
                    <select id="searchItem" onchange="renderQueryResults()">
                        <option value="">全部項目</option>
                        <option value="記帳服務">記帳服務</option>
                        <option value="財務簽證">財務簽證</option>
                        <option value="稅務簽證">稅務簽證</option>
                        <option value="財稅務簽證">財稅務簽證</option>
                        <option value="工商服務">工商服務</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
            </div>

            <!-- Filtered Table -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>客戶名稱</th>
                            <th>服務項目</th>
                            <th>服務內容</th>
                            <th>服務費</th>
                            <th>代扣稅額</th>
                            <th>服務費淨額</th>
                            <th>代墊費用</th>
                            <th>實收淨額</th>
                            <th>備註</th>
                        </tr>
                    </thead>
                    <tbody id="queryTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Empty Home View -->
    <div id="emptyPage" class="empty-state" style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:10px;">
        <h2>歡迎使用服務費收入管理系統</h2>
        <p>請點擊左側「➕ 新增年度」按鈕來建立或開啟年度工作帳頁。</p>
    </div>

    <script>
        // Data Structure
        let systemData = {
            years: {},
            currentYear: ""
        };

        // Load Data From LocalStorage on Init
        function init() {
            const localData = localStorage.getItem('notion_finance_app_data');
            if (localData) {
                try {
                    systemData = JSON.parse(localData);
                    if(!systemData.years) systemData.years = {};
                } catch(e) {
                    console.error("Data reload error, reset to safe mode.", e);
                }
            }
            renderYearList();
            if (systemData.currentYear && systemData.years[systemData.currentYear]) {
                selectYear(systemData.currentYear);
            } else {
                showEmptyState();
            }
        }

        function saveData() {
            localStorage.setItem('notion_finance_app_data', JSON.stringify(systemData));
        }

        function renderYearList() {
            const listEl = document.getElementById('yearList');
            listEl.innerHTML = '';
            Object.keys(systemData.years).sort().reverse().forEach(year => {
                const li = document.createElement('li');
                li.className = `year-item ${year === systemData.currentYear ? 'active' : ''}`;
                li.onclick = () => selectYear(year);
                li.innerHTML = `
                    <span>📅 ${year} 年</span>
                    <button class="delete-year-btn" onclick="deleteYear(event, '${year}')">刪除</button>
                `;
                listEl.appendChild(li);
            });
        }

        function promptNewYear() {
            const year = prompt("請輸入要新增的年度數字 (例如: 2026):");
            if (!year) return;
            const formattedYear = year.trim();
            if (!/^\d{3,4}$/.test(formattedYear)) {
                alert("請輸入正確的年度格式！");
                return;
            }
            if (systemData.years[formattedYear]) {
                alert("此年度已存在！");
                return;
            }
            systemData.years[formattedYear] = [];
            systemData.currentYear = formattedYear;
            saveData();
            renderYearList();
            selectYear(formattedYear);
        }

        function deleteYear(e, year) {
            e.stopPropagation();
            if (confirm(`確定要刪除整個 ${year} 年度嗎？刪除後內部所有填寫的服務費資料將永久消失！`)) {
                delete systemData.years[year];
                if (systemData.currentYear === year) {
                    systemData.currentYear = Object.keys(systemData.years)[0] || "";
                }
                saveData();
                renderYearList();
                if (systemData.currentYear) {
                    selectYear(systemData.currentYear);
                } else {
                    showEmptyState();
                }
            }
        }

        function selectYear(year) {
            systemData.currentYear = year;
            document.getElementById('emptyPage').style.display = 'none';
            document.getElementById('mainContent').style.display = 'flex';
            document.getElementById('currentYearTitle').textContent = `${year} 年度服務費收入`;
            
            // UI Active style sync
            document.querySelectorAll('.year-item').forEach(item => {
                if(item.innerText.includes(year)) item.classList.add('active');
                else item.classList.remove('active');
            });

            document.getElementById('revenueForm').reset();
            autoCalculate();
            renderTablesAndStats();
        }

        function showEmptyState() {
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('emptyPage').style.display = 'flex';
        }

        function switchTab(paneId, btnEl) {
            document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(paneId).classList.add('active');
            btnEl.classList.add('active');
            if (paneId === 'queryPane') {
                renderQueryResults();
            }
        }

        // Formula Calculation logic
        function autoCalculate() {
            const serviceFee = parseFloat(document.getElementById('serviceFee').value) || 0;
            const withholdingTax = parseFloat(document.getElementById('withholdingTax').value) || 0;
            const advancedFee = parseFloat(document.getElementById('advancedFee').value) || 0;

            // 服務費淨額 = 服務費 - 代扣稅額
            const netServiceFee = serviceFee - withholdingTax;
            // 實收淨額 = 服務費淨額 - 代墊費用
            const actualNet = netServiceFee - advancedFee;

            document.getElementById('netServiceFee').value = netServiceFee;
            document.getElementById('actualNet').value = actualNet;
        }

        function addRecord(e) {
            e.preventDefault();
            const year = systemData.currentYear;
            if (!year) return;

            const record = {
                id: Date.now(),
                clientName: document.getElementById('clientName').value.trim(),
                serviceItem: document.getElementById('serviceItem').value,
                serviceContent: document.getElementById('serviceContent').value.trim(),
                serviceFee: parseFloat(document.getElementById('serviceFee').value) || 0,
                withholdingTax: parseFloat(document.getElementById('withholdingTax').value) || 0,
                netServiceFee: parseFloat(document.getElementById('netServiceFee').value) || 0,
                advancedFee: parseFloat(document.getElementById('advancedFee').value) || 0,
                actualNet: parseFloat(document.getElementById('actualNet').value) || 0,
                remarks: document.getElementById('remarks').value.trim()
            };

            systemData.years[year].push(record);
            saveData();
            document.getElementById('revenueForm').reset();
            autoCalculate();
            renderTablesAndStats();
        }

        function deleteRecord(id) {
            if (confirm("確認刪除此筆服務費明細紀錄？")) {
                const year = systemData.currentYear;
                systemData.years[year] = systemData.years[year].filter(r => r.id !== id);
                saveData();
                renderTablesAndStats();
            }
        }

        function formatCurrency(num) {
            return '$' + num.toLocaleString('zh-TW');
        }

        function renderTablesAndStats() {
            const year = systemData.currentYear;
            const records = systemData.years[year] || [];
            
            // 1. Render Input Pane Table
            const tbody = document.getElementById('recordTableBody');
            tbody.innerHTML = '';
            
            records.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td title="${r.clientName}">${r.clientName}</td>
                    <td><span style="background:#e8f4fd; color:#1a6ec2; padding:3px 6px; border-radius:4px; font-size:12px;">${r.serviceItem}</span></td>
                    <td title="${r.serviceContent}">${r.serviceContent || '-'}</td>
                    <td>${formatCurrency(r.serviceFee)}</td>
                    <td>${formatCurrency(r.withholdingTax)}</td>
                    <td style="font-weight:600;">${formatCurrency(r.netServiceFee)}</td>
                    <td>${formatCurrency(r.advancedFee)}</td>
                    <td style="font-weight:600; color:#2cf">${formatCurrency(r.actualNet)}</td>
                    <td title="${r.remarks}">${r.remarks || '-'}</td>
                    <td class="action-cell"><button class="btn-delete-row" onclick="deleteRecord(${r.id})">刪除</button></td>
                `;
                tbody.appendChild(tr);
            });

            // 2. Render Statistics Dashboard Info
            let totalFee = 0, totalTax = 0, totalNetFee = 0, totalAdvanced = 0, totalActual = 0;
            records.forEach(r => {
                totalFee += r.serviceFee;
                totalTax += r.withholdingTax;
                totalNetFee += r.netServiceFee;
                totalAdvanced += r.advancedFee;
                totalActual += r.actualNet;
            });

            document.getElementById('statTotalFee').textContent = formatCurrency(totalFee);
            document.getElementById('statTotalTax').textContent = formatCurrency(totalTax);
            document.getElementById('statTotalNetFee').textContent = formatCurrency(totalNetFee);
            document.getElementById('statTotalAdvanced').textContent = formatCurrency(totalAdvanced);
            document.getElementById('statTotalActual').textContent = formatCurrency(totalActual);

            // Sync Query Results View if active
            renderQueryResults();
        }

        function renderQueryResults() {
            const year = systemData.currentYear;
            const records = systemData.years[year] || [];
            const searchClient = document.getElementById('searchClient').value.toLowerCase().trim();
            const searchItem = document.getElementById('searchItem').value;

            const queryTbody = document.getElementById('queryTableBody');
            queryTbody.innerHTML = '';

            const filtered = records.filter(r => {
                const matchClient = r.clientName.toLowerCase().includes(searchClient);
                const matchItem = searchItem === "" || r.serviceItem === searchItem;
                return matchClient && matchItem;
            });

            filtered.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td title="${r.clientName}">${r.clientName}</td>
                    <td>${r.serviceItem}</td>
                    <td title="${r.serviceContent}">${r.serviceContent || '-'}</td>
                    <td>${formatCurrency(r.serviceFee)}</td>
                    <td>${formatCurrency(r.withholdingTax)}</td>
                    <td>${formatCurrency(r.netServiceFee)}</td>
                    <td>${formatCurrency(r.advancedFee)}</td>
                    <td style="font-weight:600; color:#1a6ec2;">${formatCurrency(r.actualNet)}</td>
                    <td title="${r.remarks}">${r.remarks || '-'}</td>
                `;
                queryTbody.appendChild(tr);
            });
        }

        // Data Management Backup Utilities
        function exportCSV() {
            const year = systemData.currentYear;
            const records = systemData.years[year] || [];
            if(records.length === 0) { alert("目前沒有資料可匯出！"); return; }

            let csvContent = "\uFEFF客戶名稱,服務項目,服務內容,服務費,代扣稅額,服務費淨額,代墊費用,實收淨額,備註\n";
            records.forEach(r => {
                csvContent += `"${r.clientName}","${r.serviceItem}","${r.serviceContent || ''}",${r.serviceFee},${r.withholdingTax},${r.netServiceFee},${r.advancedFee},${r.actualNet},"${r.remarks || ''}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `${year}_服務費收入明細表.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(systemData));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `服務費收入系統_完整資料備份.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);
        }

        function importBackup() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.readAsText(file, 'UTF-8');
                reader.onload = readerEvent => {
                    try {
                        const parsed = JSON.parse(readerEvent.target.result);
                        if (parsed.years) {
                            systemData = parsed;
                            saveData();
                            init();
                            alert("資料還原成功！");
                        } else {
                            alert("格式錯誤，無法還原該備份檔。");
                        }
                    } catch(e) {
                        alert("讀取檔案出錯。");
                    }
                }
            }
            input.click();
        }

        window.onload = init;
    </script>
</body>
</html>
